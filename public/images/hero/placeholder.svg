<svg viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a laptop and phone showing a small-business website">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5F3"/>
      <stop offset="1" stop-color="#EBE6E1"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A2436"/>
      <stop offset="1" stop-color="#7A1B2E"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E0DB"/>
      <stop offset="1" stop-color="#CFC9C2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D1F21" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="600" fill="url(#bg)"/>

  <!-- Soft brand accents -->
  <circle cx="632" cy="70" r="150" fill="#7A1B2E" opacity="0.06"/>
  <circle cx="96" cy="150" r="96" fill="#D89AA6" opacity="0.16"/>
  <circle cx="628" cy="470" r="8" fill="#D89AA6" opacity="0.7"/>
  <circle cx="150" cy="470" r="5" fill="#7A1B2E" opacity="0.35"/>

  <!-- Desk surface -->
  <rect x="0" y="452" width="720" height="148" fill="#E7E1DB"/>
  <rect x="0" y="452" width="720" height="2" fill="#DAD3CC"/>

  <!-- Ground shadow under laptop -->
  <ellipse cx="360" cy="470" rx="230" ry="26" fill="#1D1F21" opacity="0.10"/>

  <!-- ============ Laptop ============ -->
  <g filter="url(#soft)">
    <!-- Screen bezel -->
    <rect x="196" y="132" width="330" height="212" rx="12" fill="#1D1F21"/>
    <!-- Screen -->
    <rect x="210" y="146" width="302" height="184" rx="3" fill="#FFFFFF"/>

    <!-- Mini website on screen -->
    <!-- top nav -->
    <rect x="210" y="146" width="302" height="30" fill="url(#maroon)"/>
    <rect x="223" y="154" width="14" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="245" y="159" width="34" height="4" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="452" y="157" width="46" height="10" rx="3" fill="#FFFFFF"/>
    <!-- hero copy (left) -->
    <rect x="228" y="196" width="132" height="11" rx="3" fill="#1D1F21"/>
    <rect x="228" y="214" width="150" height="11" rx="3" fill="#1D1F21"/>
    <rect x="228" y="238" width="120" height="6" rx="3" fill="#9A9A9A"/>
    <rect x="228" y="250" width="140" height="6" rx="3" fill="#9A9A9A"/>
    <rect x="228" y="272" width="66" height="18" rx="4" fill="#7A1B2E"/>
    <!-- hero image block (right) -->
    <rect x="386" y="196" width="106" height="96" rx="6" fill="#F1ECE7"/>
    <path d="M386 262 l30 -26 22 18 26 -22 28 24 v30 a6 6 0 0 1 -6 6 h-94 a6 6 0 0 1 -6 -6 z" fill="#D89AA6" opacity="0.8"/>
    <circle cx="410" cy="222" r="10" fill="#D89AA6"/>
  </g>

  <!-- Laptop base / keyboard deck -->
  <path d="M182 344 h362 l30 26 H152 z" fill="url(#metal)"/>
  <rect x="150" y="368" width="420" height="10" rx="5" fill="#BEB7AF"/>
  <!-- trackpad notch -->
  <path d="M330 344 h60 a8 8 0 0 1 -8 8 h-44 a8 8 0 0 1 -8 -8 z" fill="#C4BDB5"/>

  <!-- ============ Phone (mobile view) ============ -->
  <g filter="url(#soft)">
    <rect x="540" y="286" width="86" height="170" rx="16" fill="#1D1F21"/>
    <rect x="549" y="298" width="68" height="146" rx="6" fill="#FFFFFF"/>
    <!-- mini mobile site -->
    <rect x="549" y="298" width="68" height="22" rx="0" fill="url(#maroon)"/>
    <rect x="556" y="306" width="10" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="557" y="332" width="46" height="7" rx="2" fill="#1D1F21"/>
    <rect x="557" y="344" width="52" height="7" rx="2" fill="#1D1F21"/>
    <rect x="557" y="362" width="52" height="30" rx="4" fill="#F1ECE7"/>
    <rect x="557" y="400" width="34" height="11" rx="3" fill="#7A1B2E"/>
    <!-- notch -->
    <rect x="573" y="291" width="20" height="4" rx="2" fill="#3A3E42"/>
  </g>

  <!-- ============ Coffee mug ============ -->
  <g>
    <path d="M150 402 h44 v30 a14 14 0 0 1 -14 14 h-16 a14 14 0 0 1 -14 -14 z" fill="url(#maroon)"/>
    <path d="M194 408 a12 12 0 0 1 0 22" fill="none" stroke="#7A1B2E" stroke-width="6"/>
    <rect x="150" y="402" width="44" height="7" rx="3" fill="#F4F2F0"/>
    <!-- steam -->
    <path d="M164 392 q5 -8 0 -16" fill="none" stroke="#D89AA6" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M180 392 q5 -8 0 -16" fill="none" stroke="#D89AA6" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
